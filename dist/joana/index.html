const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptPage(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.iv)},key,d(P.data));
  return new TextDecoder().decode(pt);
}
async function go(pw,keep){
  const html=await decryptPage(pw);
  if(keep){try{sessionStorage.setItem("mute_ctrl_pw",pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="Prüfe …";e.textContent="";
  try{await go(document.getElementById("pw").value,document.getElementById("keep").checked);}
  catch(x){e.textContent="Passwort falsch.";b.disabled=false;b.textContent="Öffnen";}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("mute_ctrl_pw")}catch(e){}
  if(s){try{await go(s,false)}catch(e){try{sessionStorage.removeItem("mute_ctrl_pw")}catch(_){}}}})();
