const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(D));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
(async()=>{try{const s=sessionStorage.getItem("hb-k");if(s)show(await open(s));}catch(e){sessionStorage.removeItem("hb-k");}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const b=document.getElementById("b"),e=document.getElementById("e"),pw=document.getElementById("pw").value;
  if(!window.crypto||!crypto.subtle){e.textContent="Bitte die Seite über https:// öffnen.";return;}
  b.disabled=true;e.textContent="";b.textContent="Prüfe …";
  try{const h=await open(pw);try{sessionStorage.setItem("hb-k",pw)}catch(x){}show(h);}
  catch(x){e.textContent="Passwort falsch.";b.disabled=false;b.textContent="Öffnen";}
});
})();
